name: Publish to pub.dev

# `melos version` tags each bumped package as `<package>-vX.Y.Z`; pushing such
# a tag publishes that package. pub.dev "Automated publishing" is enabled for
# HelloPrimary/firebase_app_distribution on each package with the tag pattern
# `<package>-v{{version}}`; auth is the GitHub OIDC token, no secrets.
#
# Release flow:
#   melos version            # conventional commits → bump + CHANGELOG + commit + tags
#   git push origin main
#   git push origin <tag> <tag> <tag>   # at most 3 tags per push: GitHub runs no
#                                       # workflow when more are pushed at once.
#                                       # Push firebase_app_distribution_platform_interface
#                                       # first, firebase_app_distribution last.

on:
  push:
    tags:
      - 'firebase_app_distribution-v[0-9]+.[0-9]+.[0-9]+*'
      - 'firebase_app_distribution_android-v[0-9]+.[0-9]+.[0-9]+*'
      - 'firebase_app_distribution_ios-v[0-9]+.[0-9]+.[0-9]+*'
      - 'firebase_app_distribution_platform_interface-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write # pub.dev OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve package and version from the tag
        id: tag
        run: |
          package="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          actual=$(awk '/^version:/ {print $2}' "$package/pubspec.yaml")
          if [ "$actual" != "$version" ]; then
            echo "::error::$package is $actual but tag says $version"; exit 1
          fi
          echo "flutter=$(awk '/^flutter/ {print $2}' .tool-versions | sed 's/-stable$//')" >> "$GITHUB_OUTPUT"

      # Requests the pub.dev OIDC token and stores it in the shared pub token
      # store. Runs *before* flutter-action so Flutter's `dart` ends up first on
      # PATH — these are Flutter plugins and need the Flutter SDK to publish.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.tag.outputs.flutter }}
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Publish ${{ steps.tag.outputs.package }} ${{ steps.tag.outputs.version }}
        working-directory: ${{ steps.tag.outputs.package }}
        run: dart pub publish --force
